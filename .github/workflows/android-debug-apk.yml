name: Android debug APK

on:
  push:
    branches:
      - "arena/d3b03b83-my-shooter-game"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the current branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK for testing
        uses: actions/upload-artifact@v7
        with:
          name: rage-of-fight-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to this branch for download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./rage-of-fight-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME"
          git add -f rage-of-fight-debug.apk
          if git diff --cached --quiet; then
            echo "APK already attached; nothing to commit."
          else
            git commit -m "ci: attach debug APK [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
